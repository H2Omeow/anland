# Release: builds every shippable artifact of anland (native waylandbridge,
# com.anlandnext APK, libawl AAR, SukiSU module zip with pulse, in-container
# session tarball) and attaches them to a GitHub Release.
#
# Same host prerequisites as build.yml: wayland-scanner built from the pinned
# third_party/wayland fork, libffi release tarball overlaid on the submodule
# (the git checkout ships no generated configure), Android NDK/build-tools
# from the SDK. On top of that it compiles xr/ for the runner's own arch as a
# sanity check: those binaries are NOT shipped — the SteamVR driver and the
# Vulkan layer must be built inside the container (glibc), see docs/vr.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0-xr)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 29.0.13113456
      BT_VERSION: 36.0.0
      PLATFORM_VER: android-36
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config m4 patch zip libvulkan-dev

      # libffi: overlay the v3.4.6 release tarball (same pin as the submodule)
      # so `make libffi` skips autogen.sh (Ubuntu 24.04 libtool cannot do it).
      - name: libffi release tarball (pre-generated configure)
        run: |
          curl -fsSL https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz \
            | tar xz --strip-components=1 -C third_party/libffi
          test -x third_party/libffi/configure

      - name: wayland-scanner (host, from the pinned fork)
        run: |
          meson setup /tmp/wl-scanner third_party/wayland \
            -Dscanner=true -Dlibraries=false -Ddocumentation=false \
            -Dtests=false -Ddtd_validation=false
          ninja -C /tmp/wl-scanner
          sudo install -m755 /tmp/wl-scanner/src/wayland-scanner /usr/local/bin/wayland-scanner
          wayland-scanner --version

      - name: Cache Android SDK components
        id: sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/platforms
          key: android-${{ env.NDK_VERSION }}-${{ env.BT_VERSION }}-${{ env.PLATFORM_VER }}

      - name: SDK components (NDK, build-tools, platform)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "build-tools;${BT_VERSION}" "platforms;${PLATFORM_VER}" >/dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: libffi (one-time cross-compile bootstrap)
        run: make libffi

      # VR: the driver + layer are built inside the container on the device;
      # compiling them here for the runner's arch keeps the C/C++ honest.
      - name: VR sources compile check (host arch)
        run: |
          bash xr/build.sh
          ls -l xr/build

      - name: Build (native + apk + module + anlandx)
        run: make

      - name: Checksums
        run: |
          cd build
          sha256sum anland-wayland.apk anland-awllib.aar module/anland-awl.zip anlandx.tar.gz \
            | sed 's# module/# #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/anland-wayland.apk
            build/anland-awllib.aar
            build/module/anland-awl.zip
            build/anlandx.tar.gz
            build/SHA256SUMS.txt
